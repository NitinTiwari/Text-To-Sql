[project]
name = "AI-Data-Analyst"
version = "0.1.0"
description = "Natural-language SQL generator for SQLite databases using Ollama and Gradio"
readme = "README.md"
authors = [
    { name = "nitin.iats@gmail.com", email = "nitin.iats@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.6.5",
    "langchain-ollama>=1.1.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.1.0",
    "gradio>=5.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
]

[tool.uv]
package = false
